# MkDocs configuration for PDF output
# Usage: mkdocs build -f mkdocs-pdf.yml
INHERIT: mkdocs-base.yml

plugins:
  mike:
    version_selector: false
  # https://github.com/orzih/mkdocs-with-pdf
  with-pdf:
    output_path: "pdf/Postgres1st-3.9.0-beta2.pdf"
    cover_title: "Postgres1st Documentation"
    cover_subtitle: 3.9.0-beta2
    author: "Postgres1st"
    # Was docs/images/Percona_Logo_Color.png, so a PDF built from these sources carried
    # our title, "Postgres1st Documentation", over Percona's logo and credited their
    # documentation team.
    cover_logo: docs/assets/pfw-logo.svg
    custom_template_path: resources/templates
