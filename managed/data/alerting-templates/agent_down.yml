---
templates:
  - name: pmm_agent_down
    version: 1
    summary: pfw agent down
    expr: 'pmm_managed_inventory_agents{agent_type="pmm-agent"} == bool 0 '
    for: 1m
    severity: critical
    annotations:
      description: |-
        pfw agent on node '{{ $labels.node_name }}', node ID '{{ $labels.node_id }}', cannot be reached. Host may be down.
      summary: pfw agent on node '{{ $labels.node_name }}' cannot be reached. Host may be down.
