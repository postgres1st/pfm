# Installed to /usr/lib/tmpfiles.d/pfw.conf.
# systemd mounts /run as a fresh tmpfs on every boot, wiping the runtime dirs
# the container image baked. Recreate them (owned by the pfw service account)
# before the daemons start. /srv is persistent and provisioned by pfw-init.
d /run/pfw 0750 pfw pfw -
d /run/postgresql 0750 pfw pfw -
d /run/clickhouse-server 0750 pfw pfw -
d /run/nginx 0755 pfw pfw -

# Seed first-boot EnvironmentFile defaults (copied only if absent) so the
# dynamic units come up with a working config before pmm-managed's first render,
# instead of crash-looping on empty ${VAR}s. pmm-managed overwrites them at 0600.
C /run/pfw/victoriametrics.env 0600 pfw pfw - /usr/lib/pfw/defaults/victoriametrics.env
C /run/pfw/vmalert.env 0600 pfw pfw - /usr/lib/pfw/defaults/vmalert.env
C /run/pfw/vmproxy.env 0600 pfw pfw - /usr/lib/pfw/defaults/vmproxy.env
C /run/pfw/qan-api2.env 0600 pfw pfw - /usr/lib/pfw/defaults/qan-api2.env
C /run/pfw/grafana.env 0600 pfw pfw - /usr/lib/pfw/defaults/grafana.env
