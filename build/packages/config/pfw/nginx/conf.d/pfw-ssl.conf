# see internal SSL TLS Baseline

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
ssl_session_tickets off;

# OCSP stapling disabled: the native leaf cert is self-signed (no OCSP responder),
# and stapling would make nginx reach out to a responder URL — a zero-egress
# violation. Re-enable only alongside a CA-issued cert that carries an OCSP URL.
ssl_stapling off;
ssl_stapling_verify off;

add_header Strict-Transport-Security "max-age=63072000; includeSubdomains;" always;
