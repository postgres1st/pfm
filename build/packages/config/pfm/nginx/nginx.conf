# Native pfm nginx.conf (adapted from the container image's nginx.conf).
# Divergences from the image version, required to run as the non-root pfm user
# under systemd with zero egress:
#   - pid moved into /run/nginx/ (pfm-owned via tmpfiles); /run itself is root-only.
#   - external DNS resolver removed (all upstreams are static 127.0.0.1; a resolver
#     would only be an egress path).
# user  pmm; ## ignored anyway when the master process is not run by root (it isn't).
worker_processes auto;
# worker_rlimit_nofile moved to LimitNOFILE= in pfm-nginx.service. nginx implements
# this directive with setrlimit(), which httpd_t is denied unless the global
# httpd_setrlimit boolean is on. The denial is NON-FATAL and silent: nginx starts,
# logs nothing useful, and workers run with the inherited 1024 descriptors instead of
# 65535 -- a capacity ceiling nobody notices until load. systemd sets the limit before
# exec, so no setrlimit call happens and no boolean is needed.

# Foreground mode is forced by the unit's `-g 'daemon off;'`; setting it here too
# is a duplicate directive that nginx rejects. Leave it to the unit.
# error_log to the `stderr` keyword (not /dev/stderr): nginx writes fd 2 directly,
# which systemd routes to the journal — opening the /dev/stderr *path* fails when
# fd 2 is the journal socket.
error_log  stderr warn;
pid        /run/nginx/nginx.pid;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /srv/nginx/tmp/client;
    proxy_temp_path /srv/nginx/tmp/proxy;
    fastcgi_temp_path /srv/nginx/tmp/fastcgi;
    uwsgi_temp_path /srv/nginx/tmp/uwsgi;
    scgi_temp_path /srv/nginx/tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
     }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  
        'time="$time_iso8601" '
        'host=$http_host '
        'remote_addr=$remote_addr '
        'request_method=$request_method '
        'request="$request_uri" '
        'request_time=$request_time '
        'body_bytes_sent=$body_bytes_sent '
        'server_protocol="$server_protocol" '
        'status=$status '
        'http_referrer="$http_referer" '
        'http_x_forwarded_for="$http_x_forwarded_for" '
        'http_user_agent="$http_user_agent"';

    # Access log to journald via its syslog socket. `/dev/stdout` cannot be used:
    # under systemd StandardOutput=journal, fd 1 is a socket and open("/dev/stdout")
    # fails with ENXIO. (error_log uses the `stderr` keyword above, which writes fd 2
    # directly; access_log has no such keyword, so syslog:/dev/log is the journal path.)
    access_log  syslog:server=unix:/dev/log,tag=pfm_nginx  main;

    sendfile        on;
    gzip            on;
    etag            on;

    keepalive_timeout  65;

    # No external resolver: every upstream is a static 127.0.0.1 address, so DNS
    # is never needed, and a public resolver (was 8.8.8.8) would violate zero-egress.

    ## TODO https://jira.percona.com/browse/PMM-4670
    # CWE-693, CWE-16
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    # TODO X-XSS-Protection useless for modern browsers which support CSP. We need to implement CSP instead.
    add_header X-XSS-Protection "1; mode=block";
    # CWE-524, CWE-525
    add_header Cache-control "no-cache";
    add_header Pragma "no-cache";

    # Only our own conf.d files — not a distro default.conf that the base nginx
    # package may ship in the same dir (this config is loaded via `nginx -c`).
    include /etc/nginx/conf.d/pmm*.conf;
}
