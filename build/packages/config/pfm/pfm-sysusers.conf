# Installed to /usr/lib/sysusers.d/pfm.conf; systemd-sysusers creates the
# account at package install. Every pfm-*.service runs as this user (single-UID
# model, T1). Unlike the container (which pins UID 1000), native packaging lets
# systemd allocate a system UID/GID from the reserved range so it never collides
# with the host's first login user (UID 1000). Units reference "pfm" by name, so
# the numeric id is irrelevant. Home is /srv (the persistent data root); shell
# is nologin.
#Type Name Home Shell
u pfm - "pfm monitoring service" /srv /usr/sbin/nologin
