# Installed to /usr/lib/tmpfiles.d/pfm.conf.
# systemd mounts /run as a fresh tmpfs on every boot, wiping the runtime dirs
# the container image baked. Recreate them (owned by the pfm service account)
# before the daemons start. /srv is persistent and provisioned by pfm-init.
d /run/pfm 0750 pfm pfm -
d /run/postgresql 0750 pfm pfm -
d /run/clickhouse-server 0750 pfm pfm -
d /run/nginx 0755 pfm pfm -

# Seed first-boot EnvironmentFile defaults (copied only if absent) so the
# dynamic units come up with a working config before pmm-managed's first render,
# instead of crash-looping on empty ${VAR}s. pmm-managed overwrites them at 0600.
C /run/pfm/victoriametrics.env 0600 pfm pfm - /usr/lib/pfm/defaults/victoriametrics.env
C /run/pfm/vmalert.env 0600 pfm pfm - /usr/lib/pfm/defaults/vmalert.env
C /run/pfm/vmproxy.env 0600 pfm pfm - /usr/lib/pfm/defaults/vmproxy.env
C /run/pfm/qan-api2.env 0600 pfm pfm - /usr/lib/pfm/defaults/qan-api2.env
