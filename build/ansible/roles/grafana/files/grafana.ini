##################### Grafana Configuration #####################
# Only changed settings. You can find default settings in /usr/share/grafana/conf/defaults.ini

#################################### Database ####################################
[database]
# Either "mysql", "postgres" or "sqlite3"
type = postgres
host = localhost
user = grafana
# If the password contains # or ; you have to wrap it with triple quotes. Ex """#password;"""
password = grafana
# Bound Grafana's Postgres pool (default: unlimited) so a burst of concurrent
# UI and REST API auth lookups cannot exhaust Postgres max_connections, which
# pmm-managed draws on from the same server. Agent (re)connections authenticate
# against pmm-managed's own pool, not this one.
max_open_conn = 100
max_idle_conn = 25

[paths]
# Read plugins straight out of the package that owns them (percona-dashboards
# ships pmm-app and the datasource/panel plugins here; pfm-managed adds
# pmm-compat-app to the same dir). This used to point at /srv/grafana/plugins,
# which pfm-init populated with a one-time copy on first boot -- so upgrading
# percona-dashboards or pfm-managed changed the packaged files while the running
# server kept serving the first-boot copy forever. Pointing at the package dir
# removes the copy, and with it any way for the two to drift.
plugins = /opt/postgres1st/pfmm/dashboards/panels
# Provisioning (datasources/dashboards/plugins) lives in a pfm-owned directory
# rather than grafana's own conf/provisioning: writing into another package's
# directory means an upgrade of that package can take our files with it.
provisioning = /usr/share/pfm/grafana/provisioning
# Directory where grafana can store logs
logs = /srv/logs
# Path to where grafana can store temp files, sessions, and the sqlite3 db (if that is used)
data = /srv/grafana

#################################### Logging ##########################
[log]
# Either "console", "file", "syslog". Default is console and file
mode = console

# For "console" mode only
[log.console]
# log line format, valid options are text, console and json
format = console

#################################### Server ####################################
[server]
# Bind to loopback only. Grafana's default is 0.0.0.0, which on a native install
# publishes the whole UI on port 3000 over plain HTTP -- bypassing the TLS that
# nginx terminates on 8443, which is the only port meant to be reachable. In the
# upstream container that binding is contained by the container's namespace; on a
# real host it is exposed to the LAN. nginx proxies to 127.0.0.1:3000, so nothing
# else changes.
http_addr = 127.0.0.1
# enable gzip
enable_gzip = true
# The full public facing url
root_url = https://%(domain)s/graph
# Serve Grafana from subpath specified in `root_url` setting. By default it is set to false for compatibility reasons.
serve_from_sub_path = true

#################################### Snapshots ###########################
[snapshots]
# snapshot sharing options
external_enabled = true
external_snapshot_url = https://snapshots-g710.percona.com
external_snapshot_name = Share with Percona

#################################### Dashboards History ##################
[dashboards]
# Path to the default home dashboard. If this value is empty, then Grafana uses StaticRootPath + "dashboards/home.json"
default_home_dashboard_path = /opt/postgres1st/pfmm/dashboards/panels/pmm-app/dist/dashboards/Insight/Home_Dashboard.json

#################################### Users ###############################
[users]
# Path to a custom home page. Users are only redirected to this if the default home dashboard is used. It should match a frontend route and contain a leading slash.
home_page = /d/pmm-home/home-dashboard

#################################### Anonymous Auth ######################
[auth.anonymous]
# enable anonymous access
enabled = false

[auth]
# This allows to avoid conflict with grafana proper.
login_cookie_name = pmm_session
# Set the token rotation interval to 60m.
token_rotation_interval_minutes = 60

# No need to check for grafana updates.
[analytics]
check_for_updates = false
# Zero-egress: stop plugin-update dial to grafana.com (plugins.update.checker)
check_for_plugin_updates = false
# Zero-egress: stop usage-stats reporting to stats.grafana.org
reporting_enabled = false

# Increase the reindex interval from 5m (default) to 15m.
[search]
full_reindex_interval = 15m

[unified_alerting]
enabled = true

[plugins]
# Enter a comma-separated list of plugin identifiers to identify plugins that are allowed to be loaded even if they lack a valid signature.
allow_loading_unsigned_plugins = pmm-app,pmm-check-panel-home,pmm-update,pmm-qan-app-panel,pmm-pt-summary-panel,pmm-pt-summary-datasource,pmm-compat-app
# Do not install Pyroscope and Loki plugins. The user will be able to install them manually.
preinstall_disabled = true
# Do not attempt to retrieve the public key for unsigned plugins.
public_key_retrieval_disabled = true
# Zero-egress: disable plugin catalog/admin (grafana.com/api/plugins browse)
plugin_admin_enabled = false

[feature_toggles]
# Configure each feature toggle by setting the name of the toggle to true/false.
# Ref: https://grafana.com/docs/grafana/v11.6/setup-grafana/configure-grafana/feature-toggles/
# Ref: https://grafana.com/docs/grafana/next/setup-grafana/configure-grafana/feature-toggles/ (latest)

# Search for dashboards using panel title
panelTitleSearch = true

# Enables Query Library feature in Explore
queryLibrary = true

# Hide "Migrate to Grafana Cloud" option
onPremToCloudMigrations = false

[security]
# Enable inclusion of grafana into an iframe
allow_embedding = true

#################################### Support Bundles #####################################
[support_bundles]
# Enable support bundle creation (default: true)
enabled = false

#################################### News ###############################################
[news]
# Zero-egress: stop the grafana.com news-feed fetch on UI load
news_feed_enabled = false
